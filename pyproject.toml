[project]
name = "dau-worker"
version = "0.1.0"
description = "Hash worker for dau-dashboard media items, running on oban-py"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oban==0.6.6",
    "feluda[video,audio]==0.10.1",
    "feluda-media-hash==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dau_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["contract: needs the migrated dau-dashboard test database (set DAU_TEST_DSN)"]
